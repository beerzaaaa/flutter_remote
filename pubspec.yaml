name: flutter_utility
description: "FileBeam — Wireless file transfer over local Wi-Fi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.0.11
  shelf: ^1.4.0
  shelf_static: ^1.1.0
  shelf_multipart: ^2.0.1
  mime: ^1.0.4
  http_parser: ^4.0.0
  network_info_plus: ^6.1.4
  permission_handler: ^12.0.1
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^18.0.1
  dartssh2: ^2.0.0
  qr_flutter: ^4.1.0
  google_mobile_ads: ^5.1.0
  archive: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

